name: ZAIRIS inspect

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ZAIRIS client bundles
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request
          base='https://news.zairis.workers.dev'
          paths=[
            '/_next/static/chunks/home-client-BXI0_c_e.js',
            '/_next/static/chunks/index-CdOnCZU8.js',
            '/_next/static/chunks/framework-BgSIrAUN.js',
            '/_next/static/chunks/rolldown-runtime-C60lm6uB.js',
          ]
          for p in paths:
              print('\n===',p,'===')
              try:
                  req=urllib.request.Request(base+p,headers={'User-Agent':'Mozilla/5.0'})
                  text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
              except Exception as e:
                  print('FETCH_ERROR',repr(e)); continue
              print('SIZE',len(text))
              strings=sorted(set(re.findall(r'''["'](/[^"']{1,160})["']''',text)))
              print('PATH_STRINGS')
              for s in strings[:300]: print(s)
              for kw in ['fetch(', '/api/', 'refresh', 'update', 'sync', 'cron', 'scheduled', 'trigger', 'revalidate', 'updatedAt', 'initialUpdatedAt', 'setInterval', 'router.refresh', 'news']:
                  pos=[m.start() for m in re.finditer(re.escape(kw),text,re.I)]
                  if not pos: continue
                  print('\nKEYWORD',kw,'COUNT',len(pos))
                  for i in pos[:12]:
                      print(text[max(0,i-280):min(len(text),i+500)].replace('\n',' ')[:900])
          PY
          exit 1

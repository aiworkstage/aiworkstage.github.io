name: ZAIRIS inspect

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Retry ZAIRIS exact revalidation
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          trigger='https://news.zairis.workers.dev/api/news?revalidate=1'
          read='https://news.zairis.workers.dev/api/news'
          def summary(body):
              try:
                  d=json.loads(body.decode('utf-8','replace'))
                  it=d.get('items',[]) if isinstance(d,dict) else []
                  return {'updatedAt':d.get('updatedAt'),'sourcesOnline':d.get('sourcesOnline'),'totalSources':d.get('totalSources'),'firstPublishedAt':it[0].get('publishedAt') if it else None,'firstSource':it[0].get('source') if it else None}
              except Exception: return {'body':body[:120].decode('utf-8','replace').replace('\n',' ')}
          for i in range(1,13):
              t=time.time(); req=urllib.request.Request(trigger,headers={'User-Agent':f'ZAIRIS-recovery/{i}','Cache-Control':'no-cache','Pragma':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      b=r.read(); print('ATTEMPT',i,'STATUS',r.status,'SECONDS',round(time.time()-t,3),'RESULT',json.dumps(summary(b),ensure_ascii=False))
              except urllib.error.HTTPError as e:
                  b=e.read(); print('ATTEMPT',i,'STATUS',e.code,'SECONDS',round(time.time()-t,3),'CF_ERROR',e.headers.get('cf-error-type'),'BODY',b[:100].decode('utf-8','replace').replace('\n',' '))
              except Exception as e: print('ATTEMPT',i,'ERROR',repr(e),'SECONDS',round(time.time()-t,3))
              try:
                  with urllib.request.urlopen(urllib.request.Request(read+'?check='+str(time.time()),headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=30) as r:
                      cur=summary(r.read()); print('CHECK',i,json.dumps(cur,ensure_ascii=False))
                      if cur.get('updatedAt') and cur.get('updatedAt')!='2026-08-22T20:20:39.848Z':
                          print('RECOVERED=YES'); break
              except Exception as e: print('CHECK_ERROR',repr(e))
              time.sleep(2)
          PY
          exit 1

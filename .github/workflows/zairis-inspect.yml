name: ZAIRIS inspect

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract ZAIRIS stored source inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,collections
          base='https://news.zairis.workers.dev'
          req=urllib.request.Request(base+'/api/news?inventory=1',headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          data=json.loads(urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace'))
          items=data.get('items',[])
          c=collections.Counter(x.get('source','') for x in items if x.get('source'))
          print('UPDATED_AT',data.get('updatedAt'))
          print('CURRENT_ITEMS',len(items),'DISTINCT_SOURCES',len(c))
          for src,n in c.most_common():
              domains=collections.Counter()
              examples=[]
              for x in items:
                  if x.get('source')!=src: continue
                  link=x.get('link') or x.get('url') or ''
                  if link:
                      try: domains[urllib.parse.urlsplit(link).netloc]+=1
                      except: pass
                      if len(examples)<2: examples.append(link)
              print('SOURCE',json.dumps(src,ensure_ascii=False),'COUNT',n,'DOMAINS',json.dumps(domains.most_common(5),ensure_ascii=False),'EXAMPLES',json.dumps(examples,ensure_ascii=False))
          print('\nITEM_KEYS',sorted({k for x in items for k in x.keys()}))
          if items:
              safe={k:v for k,v in items[0].items() if k not in {'summary','content','description'}}
              print('FIRST_ITEM',json.dumps(safe,ensure_ascii=False)[:3000])
          # pull archive pages to discover sources not present in current top 60
          allc=collections.Counter(c)
          for page in range(1,9):
              u=base+'/api/archive?'+urllib.parse.urlencode({'page':page,'pageSize':100,'category':'すべて','q':''})
              try:
                  d=json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=30).read().decode())
              except Exception as e:
                  print('ARCHIVE_ERR',page,repr(e)); break
              arr=d.get('items',[])
              print('ARCHIVE_PAGE',page,'ITEMS',len(arr),'TOTAL',d.get('total'))
              for x in arr:
                  if x.get('source'): allc[x['source']]+=1
              if not arr: break
          print('\nALL_DISCOVERED_SOURCES',len(allc))
          for src,n in allc.most_common(): print('ALL_SOURCE',json.dumps(src,ensure_ascii=False),'COUNT',n)
          PY
          exit 1

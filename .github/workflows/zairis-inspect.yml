name: ZAIRIS inspect

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed scheduled test endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error,urllib.parse
          base='https://news.zairis.workers.dev'
          paths=[
            '/__scheduled?cron='+urllib.parse.quote('*/10 * * * *',safe=''),
            '/cdn-cgi/handler/scheduled?format=json&cron='+urllib.parse.quote('*/10 * * * *',safe=''),
            '/cdn-cgi/mf/scheduled?cron='+urllib.parse.quote('*/10 * * * *',safe=''),
          ]
          for p in paths:
              url=base+p; print('\nTEST',url); t=time.time()
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      b=r.read(); print('STATUS',r.status,'SECONDS',round(time.time()-t,3),'TYPE',r.headers.get('Content-Type'),'BODY',b[:1000].decode('utf-8','replace').replace('\n',' '))
              except urllib.error.HTTPError as e:
                  b=e.read(); print('STATUS',e.code,'SECONDS',round(time.time()-t,3),'TYPE',e.headers.get('Content-Type'),'BODY',b[:1000].decode('utf-8','replace').replace('\n',' '))
              except Exception as e: print('ERROR',repr(e),'SECONDS',round(time.time()-t,3))
              time.sleep(1)
          print('\nRECHECK')
          req=urllib.request.Request(base+'/api/news?check='+str(time.time()),headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  d=json.loads(r.read().decode()); it=d.get('items',[])
                  print(json.dumps({'updatedAt':d.get('updatedAt'),'sourcesOnline':d.get('sourcesOnline'),'totalSources':d.get('totalSources'),'firstPublishedAt':it[0].get('publishedAt') if it else None,'firstSource':it[0].get('source') if it else None},ensure_ascii=False))
          except Exception as e: print('RECHECK_ERROR',repr(e))
          PY
          exit 1

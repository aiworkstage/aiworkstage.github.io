name: ZAIRIS endpoint inspect

on:
  push:
    branches: [main]
    paths-ignore:
      - 'zairis-diagnostic.json'
      - 'zairis-endpoints.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public app endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import re,json,urllib.request,urllib.parse,collections
          base='https://news.zairis.workers.dev'
          out={'base':base,'assets':[],'api_paths':[],'keywords':{},'errors':[]}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','replace'), r.headers.get('Content-Type','')
          try:
              html,ct=get(base+'/')
          except Exception as e:
              out['errors'].append('home:'+type(e).__name__); html=''
          paths=set()
          for m in re.findall(r'''(?:src|href)=["']([^"']+)["']''',html):
              if m.startswith('/') and ('.js' in m or '_next' in m): paths.add(m.split('?',1)[0])
          q=collections.deque(paths); seen=set(); blobs=[]
          while q and len(seen)<120:
              p=q.popleft()
              if p in seen: continue
              seen.add(p)
              try:
                  txt,ct=get(base+p)
              except Exception as e:
                  out['errors'].append(p+':'+type(e).__name__); continue
              blobs.append((p,txt))
              out['assets'].append({'path':p,'bytes':len(txt)})
              for x in re.findall(r'''["'](/_next/static/chunks/[^"']+\.js)["']''',txt):
                  if x not in seen:q.append(x)
          alltxt='\n'.join(t for _,t in blobs)
          api=set(re.findall(r'''["'`](\/api\/[A-Za-z0-9_./?=&%:-]+)["'`]''',alltxt))
          # also capture literal /api/... within minified text until delimiter
          api.update(re.findall(r'''(/api/[A-Za-z0-9_./?=&%:-]{2,120})''',alltxt))
          out['api_paths']=sorted(api)
          kws=['line','notify','push','webhook','cron','scheduled','admin','settings','config','token','message','alert','dedup','duplicate','seen','sent']
          low=alltxt.lower()
          for k in kws:
              snippets=[]; start=0
              while len(snippets)<8:
                  i=low.find(k,start)
                  if i<0: break
                  s=alltxt[max(0,i-180):min(len(alltxt),i+360)].replace('\n',' ')
                  # aggressively redact long bearer-like or token-like strings
                  s=re.sub(r'(?i)(bearer\s+)[A-Za-z0-9._~+/-]{20,}',r'\1[REDACTED]',s)
                  s=re.sub(r'(?i)(token["\'=: ]+)[A-Za-z0-9._~+/-]{20,}',r'\1[REDACTED]',s)
                  snippets.append(s[:700])
                  start=i+len(k)
              if snippets: out['keywords'][k]=snippets
          with open('zairis-endpoints.json','w') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps({'assets':len(out['assets']),'api_paths':out['api_paths'],'keyword_keys':list(out['keywords'])},ensure_ascii=False))
          PY
      - name: Commit safe endpoint inventory
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zairis-endpoints.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record ZAIRIS endpoint inventory [skip ci]'
          git push

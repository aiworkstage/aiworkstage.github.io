name: ZAIRIS inspect

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ZAIRIS split revalidation
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          base='https://news.zairis.workers.dev/api/news'
          queries=[
            'revalidate=1&limit=1',
            'revalidate=1&max=1',
            'revalidate=1&batch=1',
            'revalidate=1&batchSize=1',
            'revalidate=1&offset=0&limit=1',
            'revalidate=1&source=MarketWatch',
            'revalidate=1&source=marketwatch',
            'revalidate=1&only=MarketWatch',
            'revalidate=1&sources=1',
            'revalidate=1&mode=fast',
            'revalidate=1&light=1',
            'revalidate=1&skipDetails=1',
            'revalidate=1&skipEnrich=1',
            'revalidate=0',
          ]
          def s(body):
              try:
                  d=json.loads(body.decode('utf-8','replace'))
                  out={k:d.get(k) for k in ('updatedAt','sourcesOnline','totalSources','success','ok','error','message') if k in d}
                  it=d.get('items') if isinstance(d,dict) else None
                  if isinstance(it,list) and it: out['firstPublishedAt']=it[0].get('publishedAt');out['firstSource']=it[0].get('source')
                  return json.dumps(out,ensure_ascii=False)
              except: return body[:160].decode('utf-8','replace').replace('\n',' ')
          for q in queries:
              url=base+'?'+q
              t=time.time(); req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      b=r.read(); print('TEST',q,'STATUS',r.status,'SECONDS',round(time.time()-t,3),'BODY',s(b))
              except urllib.error.HTTPError as e:
                  b=e.read(); print('TEST',q,'STATUS',e.code,'SECONDS',round(time.time()-t,3),'ERRTYPE',e.headers.get('cf-error-type'),'BODY',s(b))
              except Exception as e:
                  print('TEST',q,'ERROR',repr(e),'SECONDS',round(time.time()-t,3))
              time.sleep(.5)
          req=urllib.request.Request(base+'?final='+str(time.time()),headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=30) as r: print('FINAL',s(r.read()))
          PY
          exit 1

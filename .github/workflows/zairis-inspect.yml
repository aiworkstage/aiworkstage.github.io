name: ZAIRIS inspect

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ZAIRIS refresh window and headers
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          urls=[
            ('NORMAL','https://news.zairis.workers.dev/api/news'),
            ('REVALIDATE','https://news.zairis.workers.dev/api/news?revalidate=1'),
            ('AFTER','https://news.zairis.workers.dev/api/news?after='+str(time.time())),
          ]
          for label,url in urls:
              print('\n===',label,'===')
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              t=time.time()
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read()
                      print('STATUS',r.status,'SECONDS',round(time.time()-t,3))
                      for k,v in r.headers.items():
                          lk=k.lower()
                          if lk in {'date','server','cache-control','age','etag','vary','cf-cache-status','cf-ray','server-timing','allow','content-type'} or lk.startswith('x-') or lk.startswith('cf-'):
                              print('HDR',k+':',v)
                      try:
                          d=json.loads(body.decode('utf-8','replace')); it=d.get('items',[])
                          print('DATA',json.dumps({'updatedAt':d.get('updatedAt'),'sourcesOnline':d.get('sourcesOnline'),'totalSources':d.get('totalSources'),'firstPublishedAt':it[0].get('publishedAt') if it else None,'firstSource':it[0].get('source') if it else None},ensure_ascii=False))
                      except Exception: print('BODY',body[:200].decode('utf-8','replace').replace('\n',' '))
              except urllib.error.HTTPError as e:
                  body=e.read(); print('STATUS',e.code,'SECONDS',round(time.time()-t,3))
                  for k,v in e.headers.items():
                      lk=k.lower()
                      if lk in {'date','server','cache-control','age','etag','vary','cf-cache-status','cf-ray','server-timing','allow','content-type'} or lk.startswith('x-') or lk.startswith('cf-'):
                          print('HDR',k+':',v)
                  print('BODY',body[:300].decode('utf-8','replace').replace('\n',' '))
              except Exception as e: print('ERROR',repr(e),'SECONDS',round(time.time()-t,3))
              time.sleep(1)
          PY
          exit 1

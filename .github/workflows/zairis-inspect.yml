name: ZAIRIS Cloudflare auth inspect

on:
  push:
    branches: [main]
    paths-ignore:
      - 'zairis-auth-diagnostic.json'
      - 'zairis-diagnostic.json'
      - 'zairis-endpoints.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Cloudflare auth and inspect worker safely
        shell: bash
        env:
          T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T2: ${{ secrets.CF_API_TOKEN }}
          T3: ${{ secrets.CLOUDFLARE_TOKEN }}
          T4: ${{ secrets.CF_TOKEN }}
          T5: ${{ secrets.WORKERS_API_TOKEN }}
          T6: ${{ secrets.WORKERS_TOKEN }}
          T7: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          T8: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          T9: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          K1: ${{ secrets.CLOUDFLARE_API_KEY }}
          K2: ${{ secrets.CF_API_KEY }}
          E1: ${{ secrets.CLOUDFLARE_EMAIL }}
          E2: ${{ secrets.CF_EMAIL }}
          A1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          A2: ${{ secrets.CF_ACCOUNT_ID }}
          VT1: ${{ vars.CLOUDFLARE_API_TOKEN }}
          VT2: ${{ vars.CF_API_TOKEN }}
          VK1: ${{ vars.CLOUDFLARE_API_KEY }}
          VE1: ${{ vars.CLOUDFLARE_EMAIL }}
          VA1: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request,urllib.error
          out={'auth_found':False,'auth_mode':None,'auth_name':None,'accounts':0,'worker_found':False,'worker_http':None,'crons':[],'script_bytes':None,'script_content_type':None,'markers':{},'error':None}
          API='https://api.cloudflare.com/client/v4'
          auth_headers=None
          # bearer tokens first
          for n in [f'T{i}' for i in range(1,10)]+['VT1','VT2']:
              v=os.getenv(n,'')
              if not v: continue
              h={'Authorization':'Bearer '+v}
              try:
                  with urllib.request.urlopen(urllib.request.Request(API+'/accounts?per_page=100',headers=h),timeout=30) as r:
                      d=json.load(r)
                  if d.get('success'):
                      auth_headers=h; out.update(auth_found=True,auth_mode='api_token',auth_name=n); accounts=d.get('result') or []; break
              except Exception: pass
          else:
              accounts=[]
          # global API key + email fallback
          if not auth_headers:
              pairs=[]
              for kn in ['K1','K2','VK1']:
                  for en in ['E1','E2','VE1']:
                      k=os.getenv(kn,''); e=os.getenv(en,'')
                      if k and e: pairs.append((kn+'+'+en,k,e))
              for name,k,e in pairs:
                  h={'X-Auth-Email':e,'X-Auth-Key':k}
                  try:
                      with urllib.request.urlopen(urllib.request.Request(API+'/accounts?per_page=100',headers=h),timeout=30) as r:
                          d=json.load(r)
                      if d.get('success'):
                          auth_headers=h; out.update(auth_found=True,auth_mode='global_api_key',auth_name=name); accounts=d.get('result') or []; break
                  except Exception: pass
          out['accounts']=len(accounts)
          # Prefer explicit account id when present, then discovered accounts
          ids=[]
          for n in ['A1','A2','VA1']:
              v=os.getenv(n,'').strip()
              if v and v not in ids: ids.append(v)
          for a in accounts:
              v=a.get('id')
              if v and v not in ids: ids.append(v)
          if auth_headers:
              for aid in ids:
                  u=f'{API}/accounts/{aid}/workers/scripts/news'
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u,headers=auth_headers),timeout=30) as r:
                          body=r.read(); ct=r.headers.get('Content-Type','')
                      out.update(worker_found=True,worker_http=200,script_bytes=len(body),script_content_type=ct)
                      # inspect only safe markers; do not save raw script
                      txt=body.decode('utf-8','replace')
                      low=txt.lower()
                      for key in ['api.line.me','push/message','multicast','broadcast','line','notify','scheduled','cron','dedup','duplicate','seen','sent','kv','d1','cache','put(','get(']:
                          hits=[]; start=0
                          while len(hits)<5:
                              i=low.find(key.lower(),start)
                              if i<0: break
                              s=txt[max(0,i-220):min(len(txt),i+520)].replace('\n',' ')
                              # redact long token-like values and auth headers
                              s=re.sub(r'(?i)(authorization.{0,20})(bearer\s+)?[A-Za-z0-9._~+/-]{24,}',r'\1[REDACTED]',s)
                              s=re.sub(r'(?i)(token|secret|key)(.{0,12})[=:][\"\']?[A-Za-z0-9._~+/-]{24,}',r'\1\2=[REDACTED]',s)
                              hits.append(s[:900]); start=i+len(key)
                          if hits: out['markers'][key]=hits
                      # schedules
                      try:
                          su=u+'/schedules'
                          with urllib.request.urlopen(urllib.request.Request(su,headers=auth_headers),timeout=30) as r: sd=json.load(r)
                          raw=sd.get('result')
                          if isinstance(raw,dict): raw=raw.get('schedules',[])
                          if isinstance(raw,list): out['crons']=[x.get('cron') for x in raw if isinstance(x,dict) and x.get('cron')]
                      except Exception as e: out['schedule_error']=type(e).__name__
                      break
                  except urllib.error.HTTPError as e:
                      out['worker_http']=e.code
                  except Exception as e:
                      out['error']=type(e).__name__
          with open('zairis-auth-diagnostic.json','w') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps({k:v for k,v in out.items() if k!='markers'},ensure_ascii=False))
          PY
      - name: Commit safe diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zairis-auth-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record ZAIRIS auth diagnostic [skip ci]'
          git push

name: ZAIRIS inspect

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ZAIRIS news API recovery paths
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          base='https://news.zairis.workers.dev/api/news'
          tests=[
            ('GET',base,None),
            ('GET',base+'?refresh=1',None),
            ('GET',base+'?force=1',None),
            ('GET',base+'?update=1',None),
            ('GET',base+'?sync=1',None),
            ('GET',base+'?revalidate=1',None),
            ('GET',base+'?cron=1',None),
            ('GET',base+'?trigger=1',None),
            ('POST',base,b'{}'),
            ('POST',base+'?refresh=1',b'{}'),
            ('POST',base+'?force=1',b'{}'),
            ('POST',base+'?update=1',b'{}'),
            ('POST',base+'?sync=1',b'{}'),
            ('OPTIONS',base,None),
            ('HEAD',base,None),
          ]
          def summarize(body):
              try:
                  d=json.loads(body.decode('utf-8','replace'))
                  out={k:d.get(k) for k in ['updatedAt','sourcesOnline','totalSources','success','ok','error','message'] if k in d}
                  items=d.get('items') if isinstance(d,dict) else None
                  if isinstance(items,list) and items:
                      x=items[0]
                      out['first']={k:x.get(k) for k in ['title','publishedAt','source','slug'] if k in x}
                  return json.dumps(out,ensure_ascii=False)[:1500]
              except Exception:
                  return body[:500].decode('utf-8','replace').replace('\n',' ')
          for method,url,data in tests:
              headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}
              if data is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:
                      body=r.read()
                      print('\nTEST',method,url)
                      print('STATUS',r.status,'ALLOW',r.headers.get('Allow'),'CACHE',r.headers.get('cf-cache-status'),'LEN',len(body))
                      print('BODY',summarize(body))
              except urllib.error.HTTPError as e:
                  body=e.read()
                  print('\nTEST',method,url)
                  print('STATUS',e.code,'ALLOW',e.headers.get('Allow'),'LEN',len(body))
                  print('BODY',summarize(body))
              except Exception as e:
                  print('\nTEST',method,url,'ERROR',repr(e))
              time.sleep(1)
          print('\nFINAL_RECHECK')
          req=urllib.request.Request(base+'?t='+str(time.time()),headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          try:
              with urllib.request.urlopen(req,timeout=40) as r:
                  body=r.read(); print('STATUS',r.status); print('BODY',summarize(body))
          except Exception as e: print('ERROR',repr(e))
          PY
          exit 1

name: ZAIRIS inspect

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Recursively inspect public ZAIRIS JavaScript chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request,urllib.error,collections
          base='https://news.zairis.workers.dev'
          req=urllib.request.Request(base+'/',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          paths=set(re.findall(r'''(?:src|href)=["']([^"']+\.js[^"']*)["']''',html))
          q=collections.deque(p.split('?',1)[0] for p in paths if p.startswith('/'))
          seen=set(); blobs={}
          while q and len(seen)<120:
              p=q.popleft()
              if p in seen: continue
              seen.add(p)
              try:
                  txt=urllib.request.urlopen(urllib.request.Request(base+p,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
              except Exception as e:
                  print('FETCH_FAIL',p,repr(e)); continue
              blobs[p]=txt
              print('FETCHED',p,'SIZE',len(txt))
              for x in re.findall(r'''["'](/_next/static/chunks/[^"']+\.js)["']''',txt):
                  if x not in seen: q.append(x)
          print('\nTOTAL_CHUNKS',len(blobs))
          keys=['marketwatch','reuters','rss','feed','scheduled','updatedAt','sourcesOnline','api/news','xml','kv','d1','cache.put','cache.get','waitUntil','cron','fetch(']
          for p,txt in blobs.items():
              low=txt.lower()
              hits=[]
              for k in keys:
                  idx=low.find(k.lower())
                  if idx>=0: hits.append((k,idx))
              if hits:
                  print('\n=== HITFILE',p,'===')
                  for k,idx in hits[:30]:
                      print('KEY',k,'AT',idx)
                      print(txt[max(0,idx-450):min(len(txt),idx+1100)].replace('\n',' ')[:1800])
              urls=sorted(set(re.findall(r'''https?://[^"'`\s)<>]+''',txt)))
              interesting=[u for u in urls if any(x in u.lower() for x in ['rss','feed','reuters','marketwatch','finance','news','xml'])]
              if interesting:
                  print('URLS',p)
                  for u in interesting[:100]: print(u[:500])
          PY
          exit 1

name: ZAIRIS repair

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair Cloudflare Worker cron
        shell: bash
        env:
          CF_TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_B: ${{ secrets.CF_API_TOKEN }}
          CF_KEY_A: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_KEY_B: ${{ secrets.CF_API_KEY }}
          CF_EMAIL_A: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_EMAIL_B: ${{ secrets.CF_EMAIL }}
          CF_ACCOUNT_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_B: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${CF_TOKEN_A:-${CF_TOKEN_B:-}}"
          KEY="${CF_KEY_A:-${CF_KEY_B:-}}"
          EMAIL="${CF_EMAIL_A:-${CF_EMAIL_B:-}}"
          ACCOUNT_ID="${CF_ACCOUNT_A:-${CF_ACCOUNT_B:-}}"
          SCRIPT_NAME="news"
          API_ROOT="https://api.cloudflare.com/client/v4"

          if [ -n "$TOKEN" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${TOKEN}")
            echo "AUTH_MODE=api_token"
          elif [ -n "$KEY" ] && [ -n "$EMAIL" ]; then
            AUTH_ARGS=(-H "X-Auth-Email: ${EMAIL}" -H "X-Auth-Key: ${KEY}")
            echo "AUTH_MODE=global_api_key"
          else
            echo "ZAIRIS_REPAIR_STATUS=missing_cloudflare_credentials"
            exit 2
          fi

          if [ -z "$ACCOUNT_ID" ]; then
            echo "ACCOUNT_DISCOVERY=started"
            curl -fsS "${API_ROOT}/accounts?per_page=50" "${AUTH_ARGS[@]}" -o /tmp/accounts.json
            python3 - <<'PY' >/tmp/account_ids.txt
          import json
          d=json.load(open('/tmp/accounts.json'))
          for x in d.get('result',[]):
              i=x.get('id')
              if i: print(i)
          PY
            while read -r aid; do
              [ -n "$aid" ] || continue
              code=$(curl -sS -o /tmp/probe.bin -w '%{http_code}' "${AUTH_ARGS[@]}" "${API_ROOT}/accounts/${aid}/workers/scripts/${SCRIPT_NAME}")
              if [ "$code" = "200" ]; then ACCOUNT_ID="$aid"; break; fi
            done </tmp/account_ids.txt
          fi

          if [ -z "$ACCOUNT_ID" ]; then
            echo "ZAIRIS_REPAIR_STATUS=account_or_worker_not_found"
            exit 3
          fi

          API="${API_ROOT}/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}"
          code=$(curl -sS -o /tmp/script.bin -w '%{http_code}' "${AUTH_ARGS[@]}" "$API")
          echo "SCRIPT_HTTP=$code"
          if [ "$code" != "200" ]; then
            echo "ZAIRIS_REPAIR_STATUS=worker_read_failed"
            exit 4
          fi

          curl -fsS "${AUTH_ARGS[@]}" "$API/schedules" -o /tmp/before.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/before.json'))
          print('CRON_BEFORE=' + ','.join(x.get('cron','') for x in d.get('result',{}).get('schedules',[])))
          PY

          curl -fsS -X PUT "$API/schedules" \
            "${AUTH_ARGS[@]}" \
            -H 'Content-Type: application/json' \
            --data '[{"cron":"*/10 * * * *"}]' \
            -o /tmp/after.json

          python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/after.json'))
          ok=d.get('success') is True
          schedules=d.get('result',{}).get('schedules',[])
          print('CRON_AFTER=' + ','.join(x.get('cron','') for x in schedules))
          print('ZAIRIS_REPAIR_STATUS=' + ('cron_repaired' if ok else 'cron_update_failed'))
          if not ok: sys.exit(5)
          PY

          curl -fsS --max-time 20 'https://news.zairis.workers.dev/' -o /tmp/site.html || true
          python3 - <<'PY'
          import re, os
          if os.path.exists('/tmp/site.html'):
              s=open('/tmp/site.html',encoding='utf-8',errors='ignore').read()
              for pat in [r'最終取得[^<]{0,100}', r'\d{1,2}/\d{1,2}[^<]{0,30}\d{1,2}:\d{2}']:
                  m=re.search(pat,s)
                  if m: print('SITE_MARKER='+m.group(0)[:140])
          PY

name: ZAIRIS repair

on:
  push:
    branches:
      - chatgpt/zairis-repair-20260823
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair Cloudflare Worker cron
        shell: bash
        env:
          CF_TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_B: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_B: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${CF_TOKEN_A:-${CF_TOKEN_B:-}}"
          ACCOUNT_ID="${CF_ACCOUNT_A:-${CF_ACCOUNT_B:-}}"
          SCRIPT_NAME="news"

          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "ZAIRIS_REPAIR_STATUS=missing_cloudflare_secrets"
            echo "Expected CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) and CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID)."
            exit 2
          fi

          API="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}"
          AUTH="Authorization: Bearer ${TOKEN}"

          echo "Checking Worker script metadata..."
          code=$(curl -sS -o /tmp/script.bin -w '%{http_code}' -H "$AUTH" "$API")
          echo "SCRIPT_HTTP=$code"
          if [ "$code" != "200" ]; then
            echo "Worker 'news' could not be read."
            head -c 2000 /tmp/script.bin || true
            exit 3
          fi

          echo "Checking Cron Triggers..."
          curl -fsS -H "$AUTH" "$API/schedules" -o /tmp/before.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/before.json'))
          print('CRON_BEFORE=' + ','.join(x.get('cron','') for x in d.get('result',{}).get('schedules',[])))
          PY

          echo "Forcing the intended 10-minute Cron Trigger..."
          curl -fsS -X PUT "$API/schedules" \
            -H "$AUTH" \
            -H 'Content-Type: application/json' \
            --data '[{"cron":"*/10 * * * *"}]' \
            -o /tmp/after.json

          python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/after.json'))
          ok=d.get('success') is True
          schedules=d.get('result',{}).get('schedules',[])
          print('CRON_AFTER=' + ','.join(x.get('cron','') for x in schedules))
          print('ZAIRIS_REPAIR_STATUS=' + ('cron_repaired' if ok else 'cron_update_failed'))
          if not ok: sys.exit(4)
          PY

          echo "Checking public site..."
          curl -fsS --max-time 20 'https://news.zairis.workers.dev/' -o /tmp/site.html
          python3 - <<'PY'
          import re
          s=open('/tmp/site.html',encoding='utf-8',errors='ignore').read()
          for pat in [r'最終取得[^<]{0,80}', r'\d{1,2}/\d{1,2}[^<]{0,20}\d{1,2}:\d{2}']:
              m=re.search(pat,s)
              if m: print('SITE_MARKER='+m.group(0)[:120])
          print('SITE_HTTP=200')
          PY

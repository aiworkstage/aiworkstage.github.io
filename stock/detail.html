<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STOCK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'SF Pro JP','Hiragino Sans','Helvetica Neue',Arial,sans-serif}
html,body{height:100%;background:#0a0e1a;color:#e2e8f0;overscroll-behavior:none}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}

/* Header */
.hd{height:50px;background:#0f1424;border-bottom:1px solid #1a2138;display:flex;align-items:center;padding:0 12px;position:sticky;top:0;z-index:100;gap:8px}
.back{font-size:1.3rem;padding:4px 8px;color:#94a3b8;border-radius:8px}
.back:active{background:#1a2138}
.hd-name{font-size:.95rem;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{font-size:1.25rem;font-weight:900;background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;cursor:pointer}
.fav{font-size:1.3rem;padding:4px 8px;border-radius:8px;color:#fbbf24}
.fav:active{background:#1a2138}

/* Price hero */
.ph{background:#0f1424;padding:14px 16px 12px;border-bottom:1px solid #1a2138}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ph-info{flex:1;min-width:0}
.ph-name{font-size:1.05rem;font-weight:800;line-height:1.3;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-sym{font-size:.72rem;color:#64748b;font-family:monospace;font-weight:600}
.ph-right{text-align:right;flex-shrink:0}
.ph-price{font-size:1.85rem;font-weight:800;letter-spacing:-.5px;line-height:1}
.ph-chg{font-size:.86rem;font-weight:700;margin-top:4px;white-space:nowrap}
.up{color:#10b981}.dn{color:#ef4444}.fl{color:#64748b}
.ph-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid #1a2138;padding-top:10px}
.ph-stat{text-align:center}
.ph-stat-l{font-size:.62rem;color:#64748b;margin-bottom:2px}
.ph-stat-v{font-size:.74rem;font-weight:700}
.ldot{width:6px;height:6px;background:#10b981;border-radius:50%;display:inline-block;animation:pulse 1.5s ease-in-out infinite;margin-right:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Period tabs */
.ptabs{background:#0f1424;display:flex;border-bottom:1px solid #1a2138;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:1;min-width:48px;padding:10px 4px;text-align:center;font-size:.76rem;font-weight:700;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:#06b6d4;border-color:#06b6d4}

/* TradingView */
.chart-wrap{background:#0f1424;height:340px;overflow:hidden;border-bottom:1px solid #1a2138}
@media(min-width:640px){.chart-wrap{height:420px}}
#tv{height:100%}

/* Tab strip */
.tabs{display:flex;background:#0f1424;border-bottom:2px solid #1a2138;position:sticky;top:50px;z-index:90}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:.82rem;font-weight:700;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:#06b6d4;border-color:#06b6d4}

/* Tab content (swipeable) */
.tab-wrap{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-wrap::-webkit-scrollbar{display:none}
.tab-pane{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:14px 14px 90px;-webkit-overflow-scrolling:touch;min-height:50vh}

/* AI section */
.ai-load{text-align:center;padding:50px 20px;color:#64748b}
.spin{display:inline-block;width:32px;height:32px;border:3px solid #1a2138;border-top-color:#06b6d4;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-load-t{font-weight:700;color:#cbd5e1;margin-bottom:6px}
.ai-load-s{font-size:.82rem;line-height:1.5}

.verdict{border-radius:14px;padding:18px 16px;margin-bottom:14px;border:1px solid}
.v-buy{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(6,182,212,.05));border-color:#10b981}
.v-hold{background:linear-gradient(135deg,rgba(202,138,4,.1),rgba(217,119,6,.05));border-color:#ca8a04}
.v-sell{background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(220,38,38,.05));border-color:#ef4444}
.v-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.v-rating{font-size:1.85rem;font-weight:900;letter-spacing:1px}
.r-buy{color:#10b981}.r-hold{color:#ca8a04}.r-sell{color:#ef4444}
.v-score-box{text-align:right;flex-shrink:0}
.v-score-l{font-size:.66rem;color:#94a3b8;margin-bottom:2px}
.v-score{font-size:1.4rem;font-weight:800;color:#fff}
.v-score sub{font-size:.78rem;font-weight:600;color:#64748b}
.v-bar{height:5px;background:#1a2138;border-radius:3px;margin-top:5px;overflow:hidden;width:80px;margin-left:auto}
.v-bar-fill{height:100%;border-radius:3px;transition:width .6s}
.v-verdict{font-size:.95rem;font-weight:700;margin-bottom:4px;color:#fff}
.v-horizon{font-size:.74rem;color:#94a3b8}

.sec-card{background:#0f1424;border:1px solid #1a2138;border-radius:12px;padding:14px;margin-bottom:10px}
.sec-h{font-size:.78rem;font-weight:800;color:#cbd5e1;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-h::before{content:'';width:3px;height:12px;background:#06b6d4;border-radius:2px}
.point-list{display:flex;flex-direction:column;gap:7px}
.point{font-size:.84rem;line-height:1.45;display:flex;gap:8px;color:#cbd5e1}
.point-i{flex-shrink:0}
.analysis-text{font-size:.86rem;line-height:1.7;color:#cbd5e1}

.ai-no{text-align:center;padding:38px 20px}
.no-i{font-size:2.5rem;margin-bottom:12px}
.no-t{font-weight:800;font-size:1rem;margin-bottom:8px;color:#cbd5e1}
.no-s{font-size:.83rem;color:#94a3b8;line-height:1.55;margin-bottom:18px}
.no-b{background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;border-radius:12px;padding:11px 22px;font-weight:700;font-size:.9rem}

/* Info table */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1a2138;font-size:.83rem}
.info-row:last-child{border:none}
.info-l{color:#94a3b8}
.info-v{font-weight:700;text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.summary{font-size:.82rem;line-height:1.7;color:#cbd5e1}

/* News */
.news-item{display:block;background:#0f1424;border:1px solid #1a2138;border-radius:10px;padding:12px;margin-bottom:8px;transition:transform .12s}
.news-item:active{transform:scale(.98);background:#161e30}
.news-title{font-size:.86rem;font-weight:700;line-height:1.4;margin-bottom:4px;color:#e2e8f0}
.news-meta{font-size:.7rem;color:#64748b;display:flex;justify-content:space-between}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#0f1424;border-top:1px solid #1a2138;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.bi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#475569;font-size:.62rem;font-weight:700}
.bi-icon{font-size:1.15rem}

/* Sheet */
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:flex-end}
.sheet-bg.open{display:flex}
.sheet{background:#0f1424;border-radius:18px 18px 0 0;padding:20px 18px 36px;width:100%;max-height:80vh;overflow-y:auto;position:relative;border-top:1px solid #1a2138}
.sheet-t{font-size:1.05rem;font-weight:800;margin-bottom:8px}
.sheet-s{font-size:.82rem;color:#94a3b8;margin-bottom:14px;line-height:1.55}
.sheet-s a{color:#06b6d4;font-weight:700}
.sheet-inp{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid #243044;background:#0a0e1a;color:#e2e8f0;font-size:.88rem;outline:none;font-family:monospace;margin-bottom:11px}
.sheet-inp:focus{border-color:#6366f1}
.sheet-save{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;font-weight:800;font-size:.93rem}
.sheet-x{position:absolute;top:13px;right:13px;background:#1a2138;border-radius:50%;width:30px;height:30px;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.disclaimer{font-size:.7rem;color:#475569;line-height:1.5;padding:14px 0;text-align:center}
</style>
</head>
<body>

<header class="hd">
  <button class="back" onclick="goBack()">←</button>
  <span class="hd-name" id="hdName">読み込み中…</span>
  <a href="/stock/" class="logo">STOCK</a>
  <button class="fav" id="favBtn" onclick="toggleFav()">☆</button>
</header>

<div class="ph">
  <div class="ph-top">
    <div class="ph-info">
      <div class="ph-name" id="phName">—</div>
      <div class="ph-sym"><span class="ldot"></span><span id="phSym">—</span></div>
    </div>
    <div class="ph-right">
      <div class="ph-price" id="phPrice">—</div>
      <div class="ph-chg fl" id="phChg">—</div>

  </div>
  <div class="ph-stats">
    <div class="ph-stat"><div class="ph-stat-l">本日高値</div><div class="ph-stat-v" id="phHigh">—</div></div>

  <div class="ptab" data-r="1D" data-i="5">1分</div>

  <div class="ptab" data-r="60M" data-i="M">月足</div>

<div class="chart-wrap"><div id="tv"></div></div>

<div class="tabs" id="tabs">
  <div class="tab on" data-i="0">AI判断</div>

</div>

    <div id="ai">
      <div class="ai-load"><div class="spin"></div><div class="ai-load-t">準備中…</div><div class="ai-load-s">株価データを取得中</div></div>

  <div class="tab-pane" id="tp1">

  </div>
  <div class="tab-pane" id="tp2">
    <div id="news"><div class="ai-load"><div class="spin"></div></div></div>
  </div>
</div>

<nav class="bnav">
  <button class="bi" onclick="location.href='/stock/'"><span class="bi-icon">🏠</span>ホーム</button>
  <button class="bi" onclick="location.href='/stock/'"><span class="bi-icon">🔍</span>検索</button>
  <button class="bi" id="bnFav" onclick="toggleFav()"><span class="bi-icon">☆</span>お気に入り</button>
  <button class="bi" onclick="openSheet()"><span class="bi-icon">⚙️</span>設定</button>
</nav>

<div class="sheet-bg" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <button class="sheet-x" onclick="closeSheet()">✕</button>
    <div class="sheet-t">⚙️ Gemini APIキー設定</div>
    <div class="sheet-s">
      キーを設定すると<strong>全ての銘柄</strong>でAI投資判断が利用できます。<br>
      <a href="https://aistudio.google.com/app/apikey" target="_blank">▶ Google AI Studioで無料取得</a>
    </div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
/* ── Param ── */
const params = new URLSearchParams(location.search);
const SYM = params.get('s');
if(!SYM){ location.replace('/stock/'); }
const URL_NAME = params.get('n') || SYM;

document.title = SYM+' | STOCK';
document.getElementById('hdName').textContent = URL_NAME;
document.getElementById('phName').textContent = URL_NAME;
document.getElementById('phSym').textContent = SYM;

function goBack(){
  if(document.referrer && document.referrer.includes(location.host)) history.back();
  else location.href = '/stock/';
}

/* ── Favorites ── */
let favs = JSON.parse(localStorage.getItem('sfav')||'[]');
function refreshFav(){
  const on = favs.includes(SYM);
  document.getElementById('favBtn').textContent = on ? '★' : '☆';
  document.getElementById('bnFav').innerHTML = '<span class="bi-icon">'+(on?'★':'☆')+'</span>お気に入り';
}
function toggleFav(){
  if(favs.includes(SYM)) favs = favs.filter(x=>x!==SYM);
  else favs.push(SYM);
  localStorage.setItem('sfav', JSON.stringify(favs));
  refreshFav();
}
refreshFav();

/* ── Currency-aware formatter ── */
function fmtPrice(p, currency){
  if(p==null) return '—';
  const cur = currency || (SYM.endsWith('.T')?'JPY':'USD');
  if(cur==='JPY') return '¥' + (p>=100?Math.round(p):p.toFixed(2)).toLocaleString();
  if(SYM.startsWith('^')||SYM.endsWith('=X')||SYM.endsWith('=F')) return p.toLocaleString(undefined,{maximumFractionDigits:p<10?4:2});
  if(cur==='USD'){
    if(p<1) return '$'+p.toFixed(4);
    if(p<100) return '$'+p.toFixed(2);
    return '$'+Math.round(p).toLocaleString();
  }
  return p.toLocaleString();
}
function fmtCap(v, currency){
  if(!v) return '—';
  const sym = currency==='JPY' ? '¥' : '$';
  if(v>=1e12) return sym+(v/1e12).toFixed(2)+'T';
  if(v>=1e9) return sym+(v/1e9).toFixed(2)+'B';
  if(v>=1e6) return sym+(v/1e6).toFixed(2)+'M';
  return sym+v.toLocaleString();
}

/* ── TradingView symbol mapping ── */
function toTV(s){
  if(s.endsWith('.T')) return 'TSE:' + s.replace('.T','');
  if(s.endsWith('-USD')) return 'BINANCE:' + s.replace('-','');
  if(s.endsWith('=X')) return 'FX:' + s.replace('=X','').replace('JPY','USDJPY').replace('USDUSDJPY','USDJPY');
  if(s.endsWith('=F')){
    if(s==='GC=F') return 'TVC:GOLD';
    if(s==='CL=F') return 'TVC:USOIL';
    return 'TVC:'+s.replace('=F','');
  }
  if(s.startsWith('^')){
    const map = {'^N225':'TVC:NI225','^TPX':'TVC:TOPIX','^GSPC':'SP:SPX','^IXIC':'NASDAQ:IXIC','^DJI':'DJ:DJI','^FTSE':'TVC:UKX','^HSI':'HSI:HSI','^STOXX50E':'TVC:SX5E'};
    return map[s] || s;
  }
  return s; // TradingView auto-resolves ticker
}

/* ── Chart ── */
let tvW = null;
function buildChart(range, interval){
  const el = document.getElementById('tv');
  el.innerHTML = '';
  try{
    tvW = new TradingView.widget({
      container_id:'tv',
      symbol: toTV(SYM),
      interval: interval,
      range: range,
      width: '100%',
      height: '100%',
      timezone: 'Asia/Tokyo',
      theme: 'dark',
      style: '1',
      locale: 'ja',
      toolbar_bg: '#0f1424',
      enable_publishing: false,
      allow_symbol_change: false,
      hide_top_toolbar: false,
      hide_side_toolbar: window.innerWidth < 640,
      withdateranges: false,
      details: false,
      hotlist: false,
      calendar: false,
      save_image: false,
      studies: [],
    });
  }catch(e){
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#475569">チャートを読み込めません</div>';
  }
}
buildChart('3M','D');

document.getElementById('ptabs').addEventListener('click', e=>{
  const t = e.target.closest('.ptab');
  if(!t) return;
  document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  buildChart(t.dataset.r, t.dataset.i);
});

/* ── Tab swipe ── */
const tabWrap = document.getElementById('tabWrap');
const tabs = document.querySelectorAll('.tab');
const panes = document.querySelectorAll('.tab-pane');

tabs.forEach((t,i)=>{
  t.addEventListener('click',()=>{
    panes[i].scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'});
  });
});

let tabSyncTimer;
tabWrap.addEventListener('scroll',()=>{
  clearTimeout(tabSyncTimer);
  tabSyncTimer = setTimeout(()=>{
    const i = Math.round(tabWrap.scrollLeft / tabWrap.clientWidth);
    tabs.forEach((t,j)=>t.classList.toggle('on', i===j));
  }, 80);
});

/* ── Yahoo fetch with CORS proxies ── */
async function yfetch(url){
  for(const src of [url, 'https://corsproxy.io/?'+encodeURIComponent(url), 'https://api.allorigins.win/raw?url='+encodeURIComponent(url)]){
    try{
      const r = await fetch(src, {signal: AbortSignal.timeout(8000)});
      if(!r.ok) continue;
      return await r.json();
    }catch(_){}
  }
  return null;
}

/* ── Load price ── */
let stockData = null;
async function loadPrice(){
  const url = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + encodeURIComponent(SYM);
  const data = await yfetch(url);
  const q = data?.quoteResponse?.result?.[0];
  if(!q){
    document.getElementById('phPrice').textContent = '—';
    return null;
  }
  stockData = q;
  renderPriceHero(q);
  renderInfo(q);
  return q;
}

function renderPriceHero(q){
  const cur = q.currency;
  document.getElementById('phName').textContent = q.longName || q.shortName || URL_NAME;
  document.getElementById('phPrice').textContent = fmtPrice(q.regularMarketPrice, cur);
  const pct = q.regularMarketChangePercent ?? 0;
  const chg = q.regularMarketChange ?? 0;
  const cls = pct>=0?'up':pct<0?'dn':'fl';
  document.getElementById('phChg').className = 'ph-chg '+cls;
  document.getElementById('phChg').textContent = (pct>=0?'+':'') + chg.toFixed(cur==='JPY'?(Math.abs(chg)>=10?0:2):2) + ' (' + (pct>=0?'+':'') + pct.toFixed(2) + '%)';
  document.getElementById('phHigh').textContent = fmtPrice(q.regularMarketDayHigh, cur);
  document.getElementById('phLow').textContent = fmtPrice(q.regularMarketDayLow, cur);
  document.getElementById('ph52h').textContent = fmtPrice(q.fiftyTwoWeekHigh, cur);
  document.getElementById('ph52l').textContent = fmtPrice(q.fiftyTwoWeekLow, cur);
}

function renderInfo(q){
  const cur = q.currency;
  const rows = [
    ['銘柄名', q.longName || q.shortName || URL_NAME],
    ['ティッカー', q.symbol],
    ['取引所', q.fullExchangeName || q.exchange || '—'],
    ['通貨', cur || '—'],
    ['現在値', fmtPrice(q.regularMarketPrice, cur)],
    ['前日終値', fmtPrice(q.regularMarketPreviousClose, cur)],
    ['始値', fmtPrice(q.regularMarketOpen, cur)],
    ['本日高値', fmtPrice(q.regularMarketDayHigh, cur)],
    ['本日安値', fmtPrice(q.regularMarketDayLow, cur)],
    ['52週高値', fmtPrice(q.fiftyTwoWeekHigh, cur)],
    ['52週安値', fmtPrice(q.fiftyTwoWeekLow, cur)],
    ['出来高', q.regularMarketVolume ? q.regularMarketVolume.toLocaleString() : '—'],
    ['平均出来高', q.averageDailyVolume3Month ? q.averageDailyVolume3Month.toLocaleString() : '—'],
    ['時価総額', fmtCap(q.marketCap, cur)],
    ['PER(実績)', q.trailingPE ? q.trailingPE.toFixed(2)+'倍' : '—'],
    ['PER(予想)', q.forwardPE ? q.forwardPE.toFixed(2)+'倍' : '—'],
    ['EPS', q.epsTrailingTwelveMonths ? q.epsTrailingTwelveMonths.toFixed(2) : '—'],
    ['配当利回り', q.dividendYield ? (q.dividendYield*100).toFixed(2)+'%' : (q.trailingAnnualDividendYield?(q.trailingAnnualDividendYield*100).toFixed(2)+'%':'—')],
    ['β値', q.beta ? q.beta.toFixed(2) : '—'],
    ['発行済株式数', q.sharesOutstanding ? fmtCap(q.sharesOutstanding,'').replace('$','') : '—'],
  ];
  document.getElementById('info').innerHTML = `
    <div class="sec-card">
      <div class="sec-h">基本情報・ファンダメンタルズ</div>
      ${rows.map(([l,v])=>`<div class="info-row"><span class="info-l">${l}</span><span class="info-v">${v||'—'}</span></div>`).join('')}
    </div>`;
}

/* ── News ── */
async function loadNews(){
  const url = 'https://query1.finance.yahoo.com/v1/finance/search?q=' + encodeURIComponent(SYM) + '&newsCount=10&quotesCount=0&lang=ja-JP&region=JP';
  const data = await yfetch(url);
  const news = data?.news || [];
  if(!news.length){
    document.getElementById('news').innerHTML = `<div class="empty" style="text-align:center;color:#475569;padding:40px"><div style="font-size:2.5rem;margin-bottom:10px">📰</div><div style="font-weight:700;margin-bottom:4px">関連ニュースが見つかりません</div></div>`;
    return;
  }
  document.getElementById('news').innerHTML = news.map(n=>{
    const date = n.providerPublishTime ? new Date(n.providerPublishTime*1000).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    return `<a class="news-item" href="${n.link}" target="_blank" rel="noopener">
      <div class="news-title">${n.title}</div>
      <div class="news-meta"><span>${n.publisher||''}</span><span>${date}</span></div>
    </a>`;
  }).join('');
}

/* ── AI ── */
async function runAI(q){
  const key = localStorage.getItem('gemini_api_key');
  if(!key){
    document.getElementById('ai').innerHTML = `
      <div class="ai-no">
        <div class="no-i">🤖</div>
        <div class="no-t">AI投資判断を有効にする</div>
        <div class="no-s">Gemini APIキーを設定すると、<strong>${URL_NAME}</strong>を含む全ての銘柄の投資判断が利用できます。<br>キーは無料で取得可能。</div>
        <button class="no-b" onclick="openSheet()">APIキーを設定</button>
      </div>`;
    return;
  }
  document.getElementById('ai').innerHTML = `<div class="ai-load"><div class="spin"></div><div class="ai-load-t">AIが分析中…</div><div class="ai-load-s">Gemini が ${URL_NAME} の投資判断を生成しています</div></div>`;

  const cur = q?.currency;
  const price = q ? fmtPrice(q.regularMarketPrice, cur) : '不明';
  const pct = q ? ((q.regularMarketChangePercent>=0?'+':'')+(q.regularMarketChangePercent||0).toFixed(2)+'%') : '不明';
  const high52 = q ? fmtPrice(q.fiftyTwoWeekHigh, cur) : '不明';
  const low52 = q ? fmtPrice(q.fiftyTwoWeekLow, cur) : '不明';
  const pe = q?.trailingPE ? q.trailingPE.toFixed(1)+'倍' : '不明';
  const div = q?.dividendYield ? (q.dividendYield*100).toFixed(2)+'%' : '不明';
  const cap = q ? fmtCap(q.marketCap, cur) : '不明';
  const sector = q?.sector || q?.industry || (q?.quoteType==='ETF'?'ETF':q?.quoteType==='CRYPTOCURRENCY'?'仮想通貨':q?.quoteType==='INDEX'?'指数':'株式');

  const prompt = `あなたは経験豊富な投資アナリストです。以下の銘柄について日本語で投資判断を提供してください。
回答は必ずJSON形式のみとし、JSON以外の文字列を一切含めないでください。

銘柄名: ${q?.longName || q?.shortName || URL_NAME}
ティッカー: ${SYM}
種別/セクター: ${sector}
現在価格: ${price}
本日変動: ${pct}
52週高値: ${high52}
52週安値: ${low52}
時価総額: ${cap}
PER(実績): ${pe}
配当利回り: ${div}

以下のJSONフォーマットのみで回答:
{
  "rating": "BUY" または "HOLD" または "SELL",
  "score": 0から100の整数,
  "verdict": "20文字以内の判断コメント",
  "strengths": ["強み1（30字以内）", "強み2（30字以内）", "強み3（30字以内）"],
  "risks": ["リスク1（30字以内）", "リスク2（30字以内）"],
  "analysis": "詳細投資分析（200文字程度）",
  "horizon": "短期" または "中期" または "長期"
}`;

  try{
    const apiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: [{parts:[{text:prompt}]}],
        generationConfig: {temperature: .3, maxOutputTokens: 1024, responseMimeType: 'application/json'}
      }),
      signal: AbortSignal.timeout(25000)
    });
    if(!apiRes.ok){
      const e = await apiRes.json().catch(()=>({}));
      throw new Error(e?.error?.message || 'API '+apiRes.status);
    }
    const rd = await apiRes.json();
    const text = rd?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const m = text.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('JSON not found');
    renderAI(JSON.parse(m[0]));
  }catch(e){
    const isKey = /API_KEY_INVALID|400|403/.test(e.message);
    document.getElementById('ai').innerHTML = `
      <div class="ai-no">
        <div class="no-i">⚠️</div>
        <div class="no-t">分析に失敗しました</div>
        <div class="no-s">${isKey?'APIキーが無効か権限不足です。':'一時的なエラーが発生しました。'}<br><br><span style="font-family:monospace;font-size:.7rem;color:#64748b">${e.message}</span></div>
        <button class="no-b" onclick="${isKey?'openSheet()':'runAI(stockData)'}">${isKey?'APIキー再設定':'再試行'}</button>
      </div>`;
  }
}

function renderAI(ai){
  const rC = {BUY:'v-buy',HOLD:'v-hold',SELL:'v-sell'};
  const rT = {BUY:'BUY',HOLD:'HOLD',SELL:'SELL'};
  const rJa = {BUY:'買い',HOLD:'中立',SELL:'売り'};
  const rTC = {BUY:'r-buy',HOLD:'r-hold',SELL:'r-sell'};
  const bColor = {BUY:'#10b981',HOLD:'#ca8a04',SELL:'#ef4444'};
  const score = Math.max(0, Math.min(100, ai.score||50));
  document.getElementById('ai').innerHTML = `
    <div class="verdict ${rC[ai.rating]||'v-hold'}">
      <div class="v-top">
        <div class="v-rating ${rTC[ai.rating]||'r-hold'}">${rT[ai.rating]||ai.rating}</div>
        <div class="v-score-box">
          <div class="v-score-l">投資魅力度</div>
          <div class="v-score">${score}<sub>/100</sub></div>
          <div class="v-bar"><div class="v-bar-fill" style="width:${score}%;background:${bColor[ai.rating]||'#06b6d4'}"></div></div>
        </div>
      </div>
      <div class="v-verdict">${rJa[ai.rating]||ai.rating}：${ai.verdict||''}</div>
      <div class="v-horizon">推奨投資期間：${ai.horizon||'中期'}</div>
    </div>
    <div class="sec-card"><div class="sec-h">📈 強み・好材料</div><div class="point-list">${(ai.strengths||[]).map(s=>`<div class="point"><span class="point-i">✅</span><span>${s}</span></div>`).join('')}</div></div>
    <div class="sec-card"><div class="sec-h">⚠️ リスク要因</div><div class="point-list">${(ai.risks||[]).map(r=>`<div class="point"><span class="point-i">⚠️</span><span>${r}</span></div>`).join('')}</div></div>
    <div class="sec-card"><div class="sec-h">📊 総合分析</div><div class="analysis-text">${ai.analysis||''}</div></div>
    <div class="disclaimer">※ Gemini AIによる自動生成です。投資判断は自己責任でお願いします。</div>`;
}

/* ── Settings ── */
function openSheet(){document.getElementById('sheet').classList.add('open');document.getElementById('ak').value=localStorage.getItem('gemini_api_key')||'';}
function closeSheet(){document.getElementById('sheet').classList.remove('open');}
function saveKey(){
  const k = document.getElementById('ak').value.trim();
  if(k) localStorage.setItem('gemini_api_key',k);
  else localStorage.removeItem('gemini_api_key');
  closeSheet();
  if(stockData) runAI(stockData);
}

/* ── Init ── */
async function init(){
  const q = await loadPrice();
  await Promise.all([runAI(q), loadNews()]);
}
init();
</script>
